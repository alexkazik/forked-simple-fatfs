[package]
name = "simple-fatfs"
version = "0.1.0-alpha.2"
edition = "2021"
description = "A simple-to-use FAT filesystem library for Rust (mainly targeted at embedded systems)"
license = "MIT"
repository = "https://github.com/Oakchris1955/simple-fatfs"
exclude = ["/.github", ".vscode", "/imgs", "**/*cliff*", "/tests"]

[dependencies]
bincode = "2.0.1"
bitfield-struct = "0.8.0"
bitflags = { version = "2.6.0" }
embedded-io = { version = "0.6.1" }
log = "0.4.22"
oem_cp = { version = "2.1.0", optional = true }
setbits = "0.1.0"
time = { version = "0.3.36", default-features = false, features = [ "parsing", "macros" ]}
typed-path = { version = "0.10.0", default-features = false }

[features]
default = ["std", "codepage"]
std = ["time/std", "time/local-offset"]
codepage = ["dep:oem_cp"]
cp437 = ["dep:oem_cp"]
cp720 = ["dep:oem_cp"]
cp737 = ["dep:oem_cp"]
cp775 = ["dep:oem_cp"]
cp850 = ["dep:oem_cp"]
cp852 = ["dep:oem_cp"]
cp855 = ["dep:oem_cp"]
cp857 = ["dep:oem_cp"]
cp858 = ["dep:oem_cp"]
cp860 = ["dep:oem_cp"]
cp861 = ["dep:oem_cp"]
cp862 = ["dep:oem_cp"]
cp863 = ["dep:oem_cp"]
cp864 = ["dep:oem_cp"]
cp865 = ["dep:oem_cp"]
cp866 = ["dep:oem_cp"]
cp869 = ["dep:oem_cp"]
cp874 = ["dep:oem_cp"]

[dev-dependencies]
akin = "0.4.0"
embedded-io-adapters = { version = "0.6.2", features = ["std"] }
regex = "1.11.2"
test-log = "0.2.16"
